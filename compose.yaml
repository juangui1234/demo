services:

  mysql:
    image: mysql:8.4
    container_name: inventario_mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: inventario_db

    ports:
      - "3307:3306"

    volumes:
      - inventario_mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10


  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: inventario_app
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:mysql://mysql:3306/inventario_db
      DB_USERNAME: root
      DB_PASSWORD: root123

    depends_on:
      mysql:
        condition: service_healthy


volumes:
  inventario_mysql_data: