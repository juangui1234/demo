<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Gestión de Clientes</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body class="container mt-5">

<!-- Navegación -->
<nav class="mb-4">

    <a th:href="@{/productos}"
       class="btn btn-outline-primary">
        Productos
    </a>

    <a th:href="@{/estantes}"
       class="btn btn-outline-primary">
        Estantes
    </a>

    <a th:href="@{/clientes}"
       class="btn btn-primary">
        Clientes
    </a>

    <a th:href="@{/clientes-externos}"
       class="btn btn-outline-primary">
        Clientes Externos
    </a>

</nav>

<h2>Registro de Clientes</h2>

<!-- Formulario -->
<form th:action="@{/clientes/guardar}"
      th:object="${cliente}"
      method="post"
      class="row g-3 mb-5">

    <!-- ID oculto -->
    <input type="hidden" th:field="*{id}">

    <!-- Nombre -->
    <div class="col-md-6">
        <label class="form-label">Nombre</label>

        <input type="text"
               th:field="*{nombre}"
               class="form-control"
               placeholder="Nombre del cliente"
               required>
    </div>

    <!-- Documento -->
    <div class="col-md-6">
        <label class="form-label">Documento</label>

        <input type="text"
               th:field="*{documento}"
               class="form-control"
               placeholder="Documento del cliente"
               required>
    </div>

    <!-- Correo -->
    <div class="col-md-6">
        <label class="form-label">Correo</label>

        <input type="email"
               th:field="*{correo}"
               class="form-control"
               placeholder="Correo electrónico"
               required>
    </div>

    <!-- Teléfono -->
    <div class="col-md-6">
        <label class="form-label">Teléfono</label>

        <input type="text"
               th:field="*{telefono}"
               class="form-control"
               placeholder="Número de teléfono"
               required>
    </div>

    <!-- Dirección -->
    <div class="col-md-9">
        <label class="form-label">Dirección</label>

        <input type="text"
               th:field="*{direccion}"
               class="form-control"
               placeholder="Dirección del cliente"
               required>
    </div>

    <!-- Guardar -->
    <div class="col-md-3 d-flex align-items-end">
        <button type="submit"
                class="btn btn-success w-100">
            Guardar
        </button>
    </div>

</form>

<h2>Listado de Clientes</h2>

<table class="table table-striped">

    <thead>
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Documento</th>
        <th>Correo</th>
        <th>Teléfono</th>
        <th>Dirección</th>
        <th>Acciones</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="c : ${clientes}">

        <td th:text="${c.id}"></td>

        <td th:text="${c.nombre}"></td>

        <td th:text="${c.documento}"></td>

        <td th:text="${c.correo}"></td>

        <td th:text="${c.telefono}"></td>

        <td th:text="${c.direccion}"></td>

        <td>
            <a th:href="@{/clientes/editar/{id}(id=${c.id})}"
               class="btn btn-warning btn-sm">
                Editar
            </a>

            <a th:href="@{/clientes/eliminar/{id}(id=${c.id})}"
               class="btn btn-danger btn-sm">
                Eliminar
            </a>
        </td>

    </tr>

    </tbody>

</table>

</body>
</html>
